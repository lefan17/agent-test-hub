[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-test-hub"
version = "0.1.0"
description = "Agent 自动测试系统：LangGraph + LLM 编排的 API / Web UI 自动化测试（测试工程师 & Agent 开发工程师双岗位简历项目）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Lefan Ma" }]
dependencies = [
  "langchain==0.3.30",
  "langchain-openai==0.3.9",
  "langgraph==0.2.76",
  "flask==3.1.3",
  "requests==2.34.2",
  "beautifulsoup4==4.15.0",
  "selenium==4.51.0",
  "pytest==9.1.1",
]

[project.scripts]
agenttest = "agenttest.runner:main"

[tool.setuptools.packages.find]
include = ["agenttest*", "demo_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
