name: AgentTest Hub CI

# 触发时机：
#   push / PR  → 主流：合入 main 或提 PR 时全量校验
#   schedule   → 每周一次夜间回归：依赖没变、代码没变也可能因为外部环境漂移而红，
#                所以除了「改动触发」，还要有「时间触发」这一条独立哨兵
#   workflow_dispatch → 手工点按钮，便于面试演示「我能在 CI 上复现任意一次运行」
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 每周日 19:00 UTC = 周一 03:00 (Asia/Shanghai)，跑一次完整回归。
    # 之所以放周末深夜：既不占用工作日 runner 配额，也能在周一上班前看到结果。
    - cron: "0 19 * * 0"
  workflow_dispatch:

# 同分支/同 PR 只保留最新一次运行：连续 push 时自动取消旧的，
# 避免「旧提交的失败」和「新提交的成功」同时挂在 PR 上误导判断。
# 注意 group 里带 github.ref：不同分支之间互不干扰（main 上的运行不会被 PR 取消）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限原则：默认只读。只有需要开 issue 的 notify job 单独申请 issues: write。
permissions:
  contents: read

env:
  # 全局统一，避免各 job 各写一份导致口径漂移
  PYTHON_VERSION: "3.12"
  # 覆盖率门槛（实测见 pyproject.toml [tool.coverage.report] 上方注释）：
  #   仓库默认配置（分支覆盖）76.88% / 关掉分支的语句覆盖对照 79.07% → 门槛取 70，
  #   留约 6.9 个百分点的余量。取整不取小数，是为了让门槛是「好记好解释的整数」。
  COV_FAIL_UNDER: "70"

jobs:
  # =========================================================================
  # 1) test —— 主门禁：测试套件 + 覆盖率门槛
  # =========================================================================
  test:
    name: 测试套件 + 覆盖率门槛
    runs-on: ubuntu-latest
    # 没有超时的工作流 = 卡死的 runner 会一直占着配额直到 GitHub 的 6 小时上限。
    # 本仓库全套测试本机实测约 21 秒（CI 上两步合计 12.8s + 8.0s 也约 21 秒），
    # 给 15 分钟是 40 倍以上的余量，够慢 runner 喘气。
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # 运行依赖与工程化依赖分开装：
      # requirements.txt 是被测系统 + Agent 的运行依赖（8 行全 == 钉死）；
      # requirements-dev.txt 额外带 pytest-cov / mypy / ruff 等（用 -r 引用前者）。
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # 为什么必须写 `-o addopts=`：pyproject.toml 里 `addopts = "-q"`，
      # 而 pytest 的 `-q` 会连同末尾的 summary 行（"161 passed, ..."）一起吞掉。
      # 命令行上的 `-o addopts=` 把配置里的值覆盖为空，计数才会出现在 CI 日志里。
      #
      # 非 UI 用例：被测系统是本地 Flask Demo，RAG 检索默认后端是纯标准库 BM25，
      # 全程不依赖网络也不依赖浏览器，所以这一组红了就是真坏了，必须拦住流水线。
      #
      # 为什么必须是 `python -m pytest` 而不是裸 `pytest`：
      # 本仓库的依赖只装在 requirements.txt 里（不含 `-e .`），被测包 demo_app/agenttest
      # 没有被装进 site-packages。裸 `pytest` 脚本入口不会把当前目录加进 sys.path，
      # 于是 tests/conftest.py 的 `from demo_app.app import create_app` 直接
      # ModuleNotFoundError，整个套件一条都跑不起来（exit code 4）。
      # `python -m pytest` 会把当前目录加进 sys.path[0]，与 README 里记载的本地命令一致。
      - name: 运行测试套件 + 覆盖率门槛
        run: |
          python -m pytest -o addopts= -q --ignore=tests/test_ui_tool.py \
            --cov=agenttest --cov=demo_app \
            --cov-report=term-missing \
            --cov-report=json:.coverage.json \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=${{ env.COV_FAIL_UNDER }}

      # ------------------------------------------------------------------
      # per-file 覆盖率门禁：补上仓库级 fail_under 结构性看不见的那块。
      #
      # 为什么需要它：上面那一步的 70 是**仓库级**门槛。本仓的活证据是
      # agenttest/runner.py —— 126 语句 / 34 分支的系统主入口，原先是 0%
      # 覆盖，而总覆盖率仍有 76.88%、照样绿。换句话说：把整个 CLI 删掉，
      # 仓库级门禁也不会响。仓库自己早就把这件事写在 README 里（「60/65/70/75
      # 抓到的都是同样这 3 个文件」），只是一直没有工具去判。
      #
      # 为什么是独立一步而不是塞进上一条命令：coverage 7.16.2 的
      # CoverageConfig **没有** per-file 的 fail_under（只有全局那个），
      # 所以只能读 `--cov-report=json` 的产物自己判。独立一步的另一个好处
      # 是失败信息独立成段，日志里一眼能看到是哪个文件、缺哪些行。
      #
      # 配置住在 pyproject.toml 的 [tool.coverage.perfile]（coverage 不读
      # 那张表，读它的是 scripts/check_coverage.py）。门槛是棘轮不是目标。
      # ------------------------------------------------------------------
      - name: per-file 覆盖率门禁（拦单点失守）
        if: always()
        run: python scripts/check_coverage.py

      # 覆盖率报告作为构建产物留档：面试时可以直接下载 XML 佐证数字。
      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14

      # UI 用例依赖真实 Chrome（tests/test_ui_tool.py 的 4 条）：
      # 本仓的 Chrome 探测只认 Windows 安装路径（agenttest/config.py 的
      # DEFAULT_CHROME_CANDIDATES），Linux runner 上必然探测不到，
      # 因此这 4 条在 CI 里是 skipped 而不是 failed（实测 run 38936350756）。
      # 但「能跑就跑」：浏览器与驱动版本漂移属于外部因素，与仓库代码无关，
      # 因此设 continue-on-error: true —— UI 失败只标黄、不判红，不阻断整个流水线。
      #
      # 这不等于可以不管：日志里能看到这条命令的真实计数与报错。
      # 但若环境能探测到 Chrome 却禁止它创建子进程（例如受限沙箱），
      # 这 4 条会以 failed 收场，且与仓库代码无关。
      # 实测：CI runner 上探测不到 Chrome → 304 passed, 8 skipped, 15 xfailed；
      # 本机（Chrome 可用、可起子进程）→ 308 passed, 4 skipped, 15 xfailed。
      # 其中 4 条 skipped 恒为 LLM 冒烟（`llm_smoke` marker，无 Key 时 skip）。
      # 这里跑全量套件（而非只跑 UI 文件），是为了让 CI 的这条命令与
      # README 的 `.venv/Scripts/python.exe -m pytest -q` 一一对应。
      #
      # 注意：这一步不加 --cov-fail-under。它跑的是全量套件，与上面那条
      # 「非 UI + 覆盖率门槛」的门禁是两件事，门槛只在上面那条命令上生效。
      - name: 运行全量套件含 UI（CI runner 探测不到 Chrome，UI 用例 skip）
        continue-on-error: true
        run: python -m pytest -o addopts= -q

  # =========================================================================
  # 2) lint —— 静态类型 + 代码规范（新增 job，同样带 pip 缓存）
  # =========================================================================
  lint:
    name: 静态类型 (mypy) + 代码规范 (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          # lint job 一样要 pip 缓存：mypy/ruff 及其依赖安装同样耗时
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # mypy 的 python_version / 扫描目录 / 严格度全部来自 pyproject.toml [tool.mypy]，
      # 命令行不重复传参 —— 本地 .pre-commit-config.yaml 的 mypy hook 也读同一份配置，
      # 保证「本地过 = CI 过」，不会出现两套口径。
      #
      # 注意：不加 --ignore-missing-imports（已写进 pyproject），
      # 否则 CI 会悄悄比本地宽松，本地报的错在 CI 上消失。
      - name: mypy 静态类型检查（0 error）
        run: python -m mypy

      # ruff 的规则集同样来自 pyproject.toml [tool.ruff]。
      - name: ruff 代码规范检查
        run: python -m ruff check . --output-format=github

      # `ruff format --check` 是**阻塞项**（2026-10-18 起）。
      #
      # 此前这里特意没有这一步，理由写在下面（原文保留，作为决策记录）：
      #   「实测 `ruff format --check .` 报 35 files would be reformatted, 11 files
      #     already formatted（EXIT=1），一次性格式化会跨越『只动工程化外壳』的边界。」
      # 那个理由在当时成立，但它把一件工程卫生的事无限期推后了：只跑 `ruff check`
      # 而不管格式，等于格式约定靠人自觉，而人不会自觉。
      #
      # 2026-10-18 把存量一次清完：本机 `ruff format .` 重排 38 个文件、12 个已合规，
      # 重排后 50 files already formatted；同一棵树复跑 `pytest -o addopts= -q` 仍是
      # 165 passed / 15 xfailed，`python -m mypy` 仍是 24 source files 零问题——
      # 即这次重排只动空白，没动任何判定逻辑。
      # 存量清零之后再挂门禁才是有意义的：从此刻起，新增的未格式化代码会当场被拦。
      - name: ruff 格式检查（阻塞）
        run: python -m ruff format --check .

      # 锁文件一致性：CI 必须发现「有人改了 requirements.txt 却忘了重新 compile」。
      # requirements.lock 由 `python -m piptools compile requirements.txt` 生成，
      # 这里只做「文件存在且能被解析为合法 pin」的轻量校验，不重新解析依赖树
      # （重新解析需要联网访问 PyPI，会让这个 job 依赖外部可用性）。
      - name: 校验 requirements.lock 存在且格式合法
        run: |
          python - <<'PY'
          import re, sys
          from pathlib import Path
          lock = Path("requirements.lock")
          if not lock.exists():
              sys.exit("requirements.lock 缺失：请运行 python -m piptools compile requirements.txt -o requirements.lock")
          pin = re.compile(r"^[A-Za-z0-9._-]+==[^\s;]+$")
          bad = [ln for ln in lock.read_text(encoding="utf-8").splitlines()
                 if ln.strip() and not ln.startswith(("#", " ", "-")) and not pin.match(ln.strip())]
          if bad:
              sys.exit("requirements.lock 存在非 pin 行：\n" + "\n".join(bad))
          print(f"requirements.lock 校验通过：{len(lock.read_text(encoding='utf-8').splitlines())} 行")
          PY

  # =========================================================================
  # 3) container —— 容器化静态校验 + 真实构建 + 冒烟（新增 job）
  # =========================================================================
  #
  # 为什么要有这个 job，而不是只在本机做 `docker compose config --quiet`：
  #   本机沙箱的 Docker daemon 起不来（WSL E_ACCESSDENIED），
  #   本地只能做**静态校验**，从未真的 build/run 过镜像。
  #   ubuntu-latest runner 自带可用 daemon，于是把「真实构建 + 冒烟」放到这里，
  #   让「未验证」这件事在 CI 上被真正验证掉，而不是永远挂着一句「未验证」。
  container:
    name: 容器化（compose 静态校验 + 构建 + 冒烟）
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # 静态校验：compose 文件语法 + 变量插值 + service 定义是否合法。
      # 这一步不需要 daemon 也能跑，与本地沙箱的验收命令完全一致。
      #
      # ⚠️ 必须带 `--profile "*"`：本文件两个 service 都挂了 profiles，
      #    `docker compose config` 在**不激活任何 profile** 时会把它们全部过滤掉，
      #    解析结果退化成 `services: {}`——照样 EXIT=0，但等于什么都没校验。
      #    本机实测：不带 profile → `services: {}`；带 `--profile "*"` → demo-app + tests 都在。
      - name: docker compose 静态校验
        run: docker compose --profile '*' -f docker-compose.yml config --quiet

      - name: 准备 buildx（用 GHA 缓存加速，第二次构建走缓存）
        uses: docker/setup-buildx-action@v4

      # 两个镜像分别对应 compose 的两条路径：
      #   INSTALL_DEV=0 → 只装运行依赖（跑被测系统）
      #   INSTALL_DEV=1 → 额外装 requirements-dev.txt（跑测试 + 覆盖率）
      - name: 构建运行镜像（INSTALL_DEV=0）
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: agent-test-hub:ci
          build-args: |
            INSTALL_DEV=0
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime

      - name: 构建测试镜像（INSTALL_DEV=1）
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: agent-test-hub:test-ci
          build-args: |
            INSTALL_DEV=1
          cache-from: type=gha,scope=test
          cache-to: type=gha,mode=max,scope=test

      # 冒烟一：运行镜像能真的把被测系统起起来并响应 /openapi.json。
      # 只看「构建成功」不算数 —— 构建成功但 CMD 写错、端口没暴露、
      # 包导入路径不对，都会在容器起来的瞬间才暴露。
      #
      # 失败时必须能自证是「哪一侧」的问题，所以探活分两段独立探测：
      #   内层 docker exec -> http://127.0.0.1:5001  （只有容器里真的起来了才会通）
      #   外层 curl        -> http://127.0.0.1:5001  （还要端口转发也对才会通）
      # 两段的组合能把故障定位到唯一一类原因：
      #   内层失败          → 服务根本没起来（CMD / 导入 / 依赖 / 端口）
      #   内层通、外层失败  → 服务起来了但宿主不可达（绑定地址 / -p 映射）
      # 这个区分是必需的：本 job 第一版只探了外层，CI 红在
      #   `curl: (56) Recv failure: Connection reset by peer`
      # 当时无法一眼判断是没起来还是绑了回环，排查靠猜。
      - name: 冒烟：运行镜像起服务并探活
        run: |
          set -uxo pipefail
          docker run -d --name agenttest-smoke -p 5001:5001 agent-test-hub:ci

          # 容器内探活（镜像里没有 curl/wget，用标准库 urllib）
          inner_probe() {
            docker exec agenttest-smoke python -c \
              "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5001/openapi.json', timeout=3).status == 200 else 1)"
          }

          inner_ok=no
          outer_ok=no
          for i in $(seq 1 30); do
            if [ "$inner_ok" = "no" ] && inner_probe; then
              echo "容器内探活通过（第 ${i} 次）"
              inner_ok=yes
            fi
            if [ "$outer_ok" = "no" ] && curl -fsS http://127.0.0.1:5001/openapi.json > /dev/null; then
              echo "宿主侧探活通过（第 ${i} 次）"
              outer_ok=yes
            fi
            if [ "$inner_ok" = "yes" ] && [ "$outer_ok" = "yes" ]; then
              echo "被测系统已就绪，容器内与宿主侧均可达"
              exit 0
            fi
            sleep 2
          done

          echo "::group::失败现场：容器状态与端口映射"
          docker ps -a --filter name=agenttest-smoke
          docker port agenttest-smoke || true
          echo "::endgroup::"
          echo "::group::失败现场：容器日志"
          docker logs agenttest-smoke || true
          echo "::endgroup::"

          echo "诊断：container_reachable=${inner_ok} host_reachable=${outer_ok}"
          if [ "$inner_ok" = "no" ]; then
            echo "容器内 127.0.0.1:5001 不通 → 服务没起来（查 CMD / 导入 / 依赖 / EXPOSE）"
          elif [ "$outer_ok" = "no" ]; then
            echo "容器内通、宿主侧不通 → 绑定地址或端口映射问题"
            echo "  检查 AGENTTEST_BIND_HOST（Dockerfile ENV 与 compose environment 都应是 0.0.0.0）"
            echo "  以及 docker port 输出里 5001/tcp 是否映射到了宿主 5001"
          fi
          exit 1

      - name: 冒烟：容器日志留档（失败时排查用）
        if: always()
        run: docker logs agenttest-smoke || true

      # 冒烟二：测试镜像能在容器内跑通「非 UI + 覆盖率门槛」，
      # 与 test job 的那条命令逐字一致 —— 证明「本地怎么跑，容器里就怎么跑」。
      - name: 冒烟：测试镜像内跑测试套件 + 覆盖率门槛
        run: |
          docker run --rm \
            --name agenttest-test-run \
            agent-test-hub:test-ci \
            python -m pytest -o addopts= -q --ignore=tests/test_ui_tool.py \
              --cov=agenttest --cov=demo_app --cov-report=term-missing \
              --cov-fail-under=${{ env.COV_FAIL_UNDER }}

  # =========================================================================
  # 4) security —— 依赖漏洞扫描（新增 job，非阻塞，理由见注释）
  # =========================================================================
  #
  # 为什么 pip-audit 是「非阻塞」的：
  #   pip-audit 查的是**外部漏洞库**，不是本仓库的代码质量。
  #   同一条正确无误的提交，可能今天全绿、明天因为某个依赖被披露新 CVE 而变红；
  #   把它设成阻塞会让「与本次改动无关的失败」卡住所有人的 PR。
  #   所以：结果照跑、照进日志与 step summary，但不阻断。
  #   真正需要「强迫升级」时，由 Dependabot（.github/dependabot.yml）自动开 PR。
  #
  # 为什么这个 job 只在 push / schedule / 手动时跑，不在 PR 上跑：
  #   PR 上每周会重复扫同一个依赖集，价值重复；而且 fork PR 拿不到写权限，
  #   本来也写不了任何东西。把扫描重心放在 main 与夜间回归上。
  security:
    name: 依赖漏洞扫描 (pip-audit)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 安装 pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit==2.10.1

      # --strict 会因为在制品里发现「无法解析的依赖」也失败，
      # 这里不要它：本仓库跑的是源码目录（未 pip install -e .），
      # 只要漏洞清单本身能产出就够了。
      #
      # 注意：`pip-audit -r <file>` 在**本机沙箱跑不了** —— pip-audit 会建临时 venv
      # 并调 ensurepip，而沙箱拒绝（PermissionError: [WinError 5]），
      # `--cache-dir` 也绕不过（解析依赖阶段仍要建 venv）。
      # 但 `pip-audit --local` 能跑（无需建 venv），实测 "Found 21 known
      # vulnerabilities in 7 packages" —— 本地想自查依赖漏洞可以用它。
      # 另一个已修的独立缺陷：`-r` 读含中文注释的 requirements*.txt 时，
      # 内嵌的 pip_requirements_parser 在无 BOM、前两行无 coding 声明时会回退
      # 到 locale.getpreferredencoding()（简体中文 Windows = cp936）→
      # UnicodeDecodeError。修法是补 PEP263 首行声明，三个 requirements*.txt 都已补。
      # 结论：`-r` 路径仍只在本 CI job 里被真实验证。
      - name: pip-audit 扫描 requirements.lock
        continue-on-error: true
        id: audit
        run: |
          set +e
          pip-audit -r requirements.lock --format markdown --output pip-audit-report.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e
          {
            echo "## pip-audit 结果"
            echo ""
            if [ -f pip-audit-report.md ]; then cat pip-audit-report.md; else echo "未生成报告"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 pip-audit 报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pip-audit-report
          path: pip-audit-report.md
          if-no-files-found: warn
          retention-days: 30

  # =========================================================================
  # 5) commit-msg —— 提交信息规范（新增 job）
  # =========================================================================
  #
  # 双保险，两句都阻塞：
  #   a) wagoid/commitlint-github-action：Node 生态的标准做法，
  #      读仓库根的 commitlint.config.mjs（本地由 .husky/commit-msg 调用同一份配置）
  #      ⚠️ 必须是 .mjs：该 action 不接受 .js 配置，且 package.json 未声明
  #         "type": "module"，.js 会被当成 CommonJS。见 commitlint.config.mjs 头部注释。
  #   b) scripts/check_commit_msg.py：零依赖纯标准库实现，
  #      与 .pre-commit-config.yaml 的 local hook 是同一份逻辑。
  #      存在的意义是「没有 Node 的机器（同事本机 / 精简容器）也能做同样的校验」，
  #      也保证本仓库即使某天移掉 package.json 仍有提交规范门禁。
  commit-msg:
    name: 提交信息规范 (Conventional Commits)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码（需要完整历史才能取到提交区间）
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: commitlint（Node 生态标准工具）
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.mjs
          failOnWarnings: false

      - name: 安装 Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # 零依赖校验：不需要 npm install，任何 runner 都能跑。
      # PR 上取 base..head 区间；push 到 main 时只校验最新一条（HEAD~1..HEAD），
      # 避免因为历史里存在早期不规范的提交而永远红着。
      - name: Python 零依赖复核（scripts/check_commit_msg.py）
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eux
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_SHA" ]; then
            python scripts/check_commit_msg.py --range "$BASE_SHA..$HEAD_SHA"
          else
            python scripts/check_commit_msg.py --range "HEAD~1..HEAD"
          fi

  # =========================================================================
  # 6) notify —— 失败通知（新增 job，零 secret）
  # =========================================================================
  #
  # 设计原则：**不引用任何 secret**。
  #   需要一个 webhook URL 的做法（企业微信 / 钉钉 / Slack）只写在下面注释里，
  #   代码里绝不出现 `secrets.XXX` —— 未配置的 secret 会解析成空串，
  #   轻则静默失效，重则让整个 workflow 报错，反而把真正的失败盖掉。
  #
  # 这里做两件不需要任何凭据的事：
  #   1) 把失败摘要写进 GITHUB_STEP_SUMMARY —— 不需要任何权限，
  #      在 Actions 运行页面上直接可见；
  #   2) 用 actions/github-script + 内置 GITHUB_TOKEN 自动开/更新一个 issue ——
  #      GitHub 已经代管这个 token，属于「零 secret 配置」。
  #
  # 关于 fork PR：fork 来的 PR 上 GITHUB_TOKEN 是只读的，开 issue 必然 403。
  #   所以 (2) 加了仓库归属判断 + continue-on-error，失败也不影响整体结论。
  #
  # 如果将来要接企业微信/钉钉机器人（需要 webhook secret），正确的做法是：
  #   - 在仓库 Settings → Secrets and variables → Actions 里新增 WEBHOOK_URL；
  #   - 在这里加一步 `if: failure()` 的 curl 步骤，用 `${{ secrets.WEBHOOK_URL }}`；
  #   本任务明确要求「不需要任何 secret 的前提下做」，故此处不落地该步骤。
  notify:
    name: 失败通知（step summary + 自动开 issue）
    needs: [test, lint, container, commit-msg]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write

    steps:
      - name: 失败摘要写入 Step Summary
        run: |
          {
            echo "## ❌ CI 失败"
            echo ""
            echo "- 工作流：\`${{ github.workflow }}\`"
            echo "- 触发事件：\`${{ github.event_name }}\`"
            echo "- 分支/引用：\`${{ github.ref_name }}\`"
            echo "- 提交：\`${{ github.sha }}\`"
            echo "- 运行详情：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "> 该摘要由 notify job 生成，不依赖任何 secret。"
          } >> "$GITHUB_STEP_SUMMARY"

      # 只在 push / 定时任务失败时开 issue，PR 失败不开。
      #
      # 为什么排除 PR：PR 失败本来就显示在 PR 页面上，作者正在看那个页面；
      #   再开一个 issue 等于把同一条信息发第二遍，且每个失败 PR 都会发一封邮件。
      #   更糟的是 PR 常被 force-push，issue 里的提交号很快就指向一个不存在的状态。
      #   实测代价：2026-10-13 的 4 个 dependabot PR 各留了一个 issue
      #   （「CI 失败：5/merge」这类标题），而它们的失败原因完全相同。
      #   这里与 fullstack-test-framework 的守卫保持一致。
      #
      # fork PR 也一并被排除：其 token 只读，开 issue 必然 403。
      #
      # 这里为什么要显式写 `failure()`：GitHub 的默认状态检查是 `success()`，
      # 而本 job 的前一步（写 Summary）是成功的，只靠 `push || schedule`
      # 会让这一步在「CI 没失败」时也照开 issue。
      # 官方对 `failure()` 的定义是「本 job 有先前步骤失败，**或者链上有祖先 job 失败**」
      # （github/docs: content/actions/reference/workflows-and-actions/expressions.md），
      # 所以这里同时覆盖了「本 job 自身出问题」与「上游 job 失败」两种情况。
      - name: 自动开/更新失败 issue（内置 GITHUB_TOKEN，零 secret）
        if: failure() && (github.event_name == 'push' || github.event_name == 'schedule')
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        with:
          script: |
            const runUrl = process.env.RUN_URL;
            const ref = process.env.REF_NAME;
            const event = process.env.EVENT_NAME;
            const title = `CI 失败：${ref}`;
            const body = [
              `工作流 **${context.workflow}** 在 \`${ref}\` 上失败。`,
              ``,
              `- 触发事件：\`${event}\``,
              `- 提交：\`${context.sha}\``,
              `- 运行详情：${runUrl}`,
              ``,
              `> 本 issue 由 notify job 自动创建/更新，使用仓库内置 GITHUB_TOKEN，无需任何 secret。`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'ci-failure', per_page: 20,
            });
            const hit = existing.data.find((i) => i.title === title);
            if (hit) {
              await github.rest.issues.createComment({ owner, repo, issue_number: hit.number, body });
              core.info(`已更新已有 issue #${hit.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner, repo, title, body, labels: ['ci-failure'],
              });
              core.info(`已创建 issue #${created.data.number}`);
            }
